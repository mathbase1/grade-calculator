<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initial Assessment Combined Grade Calculator</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .invoice-box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      width: 420px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 28px;
      color: #222;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    textarea {
      height: 220px;
      resize: vertical;
      background: #fafafa;
      line-height: 1.5;
    }

    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: #66788a;
      cursor: not-allowed;
    }

    input[aria-invalid="true"] {
      border-color: #b42318;
    }

    .validation-message {
      color: #b42318;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      margin: 12px 0 0;
      white-space: pre-line;
    }

    .copied-message {
      margin-top: 10px;
      font-size: 16px;
      color: green;
      font-weight: bold;
      min-height: 20px;
    }

    #breakdownSection {
      display: none;
      margin-top: 10px;
    }

    #summaryBox {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border: 2px solid #ccc;
      border-radius: 8px;
      text-align: left;
      font-size: 18px;
      white-space: pre-line;
    }

    @media (max-width: 520px) {
      .invoice-box {
        width: calc(100% - 24px);
        padding: 24px;
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>
  <div class="invoice-box">
    <h1>Initial Assessment Combined Grade Calculator</h1>

    <label for="paperCount">Number of papers to mark</label>
    <select id="paperCount" aria-controls="paperSelection noncalcGroup calcGroup">
      <option value="1">One paper</option>
      <option value="2" selected>Two papers (combined)</option>
    </select>

    <div id="paperSelection" hidden>
      <label for="paperChoice">Paper to mark</label>
      <select id="paperChoice" aria-controls="noncalcGroup calcGroup" disabled>
        <option value="noncalc" id="noncalcOption">Non-calculator</option>
        <option value="calc" id="calcOption">Calculator</option>
      </select>
    </div>

    <div id="noncalcGroup">
      <label for="noncalc" id="noncalcLabel">Non-Calculator Marks</label>
      <input type="number" id="noncalc" placeholder="Enter marks"
             min="0" step="1" inputmode="numeric" aria-describedby="validationMessage">
    </div>

    <div id="calcGroup">
      <label for="calc" id="calcLabel">Calculator Marks</label>
      <input type="number" id="calc" placeholder="Enter marks"
             min="0" step="1" inputmode="numeric" aria-describedby="validationMessage">
    </div>

    <p id="validationMessage" class="validation-message" role="alert" hidden></p>
    <div id="summaryBox" role="status" aria-live="polite" aria-atomic="true"></div>
    <button type="button" id="copySummary" disabled>Copy Summary</button>
    <div class="copied-message" id="copiedMessageSummary" role="status"></div>

    <label for="toggle">Show Breakdown</label>
    <select id="toggle" aria-controls="breakdownSection">
      <option value="hide">Hide</option>
      <option value="show">Show</option>
    </select>

    <div id="breakdownSection">
      <label for="breakdown">Full Breakdown</label>
      <textarea id="breakdown" readonly></textarea>
      <button type="button" id="copyBreakdown" disabled>Copy Breakdown</button>
      <div class="copied-message" id="copiedMessageBreakdown" role="status"></div>
    </div>
    <noscript><p>Enable JavaScript to use this calculator.</p></noscript>
  </div>

  <script>
    "use strict";

    // The two paper maxima supplied for this assessment.
    // Change them here only: labels, selections, validation, totals and bands update together.
    const MAX_MARKS = Object.freeze({ noncalc: 52, calc: 61 });
    const TOTAL_MAX = MAX_MARKS.noncalc + MAX_MARKS.calc;

    // Minimum percentage thresholds, in ascending order.
    // Each grade continues up to (but not including) the next threshold.
    // Do not add inclusive percentage maxima: those caused the original gaps.
    const boundaries = [
      { grade: "U", minPct: 0 },
      { grade: "1", minPct: 10 },
      { grade: "2", minPct: 23 },
      { grade: "3", minPct: 38 },
      { grade: "4", minPct: 54 },
      { grade: "5", minPct: 69 }
    ];
    const LEVELS = ["LOW", "MEDIUM", "HIGH"];

    // A grade starts at the first whole mark that reaches its threshold.
    // It ends exactly one mark below the next grade's first mark.
    // Rebuild the whole-mark bands for the selected paper maximum, not always 113.
    function buildGradeBands(maximum) {
      if (!Number.isSafeInteger(maximum) || maximum <= 0) {
        throw new RangeError("The maximum mark must be a positive whole number.");
      }
      return boundaries.map((boundary, index) => {
        const nextBoundary = boundaries[index + 1];
        return {
          grade: boundary.grade,
          minPct: boundary.minPct,
          minMark: Math.ceil(boundary.minPct * maximum / 100),
          maxMark: nextBoundary
            ? Math.ceil(nextBoundary.minPct * maximum / 100) - 1
            : maximum
        };
      });
    }

    const paperCountSelect = document.getElementById("paperCount");
    const paperChoiceSelect = document.getElementById("paperChoice");
    const paperSelection = document.getElementById("paperSelection");
    const noncalcInput = document.getElementById("noncalc");
    const calcInput = document.getElementById("calc");
    const breakdownBox = document.getElementById("breakdown");
    const summaryBox = document.getElementById("summaryBox");
    const validationMessage = document.getElementById("validationMessage");
    const toggle = document.getElementById("toggle");
    const breakdownSection = document.getElementById("breakdownSection");
    const copyBreakdown = document.getElementById("copyBreakdown");
    const copiedMessageBreakdown = document.getElementById("copiedMessageBreakdown");
    const copySummary = document.getElementById("copySummary");
    const copiedMessageSummary = document.getElementById("copiedMessageSummary");
    let calculationVersion = 0;

    const papers = [
      {
        id: "noncalc", name: "Non-calculator", maximum: MAX_MARKS.noncalc,
        input: noncalcInput, group: document.getElementById("noncalcGroup")
      },
      {
        id: "calc", name: "Calculator", maximum: MAX_MARKS.calc,
        input: calcInput, group: document.getElementById("calcGroup")
      }
    ];

    noncalcInput.max = String(MAX_MARKS.noncalc);
    calcInput.max = String(MAX_MARKS.calc);
    document.getElementById("noncalcLabel").textContent =
      `Non-Calculator Marks (${MAX_MARKS.noncalc} max)`;
    document.getElementById("calcLabel").textContent =
      `Calculator Marks (${MAX_MARKS.calc} max)`;
    document.getElementById("noncalcOption").textContent =
      `Non-calculator (${MAX_MARKS.noncalc} max)`;
    document.getElementById("calcOption").textContent =
      `Calculator (${MAX_MARKS.calc} max)`;

    function getSelectedPapers() {
      return paperCountSelect.value === "1"
        ? papers.filter(paper => paper.id === paperChoiceSelect.value)
        : papers;
    }

    function syncPaperSelection() {
      const singlePaper = paperCountSelect.value === "1";
      paperSelection.hidden = !singlePaper;
      paperChoiceSelect.disabled = !singlePaper;
      const selectedPapers = getSelectedPapers();
      papers.forEach(paper => {
        const selected = selectedPapers.includes(paper);
        paper.group.hidden = !selected;
        paper.input.disabled = !selected;
      });
      // Preserve entered marks for switching back, but never include hidden marks.
      updateGrade();
    }

    toggle.addEventListener("change", () => {
      breakdownSection.style.display = toggle.value === "show" ? "block" : "none";
    });

    function determineGrade(total, maximum = TOTAL_MAX) {
      if (!Number.isInteger(total) || total < 0 || total > maximum) {
        throw new RangeError(`Total marks must be a whole number from 0 to ${maximum}.`);
      }

      const gradeBands = buildGradeBands(maximum);
      const band = gradeBands.find(b => total >= b.minMark && total <= b.maxMark);
      if (!band) {
        throw new Error("The grade boundary configuration does not cover this total.");
      }

      // Keep the original whole-mark thirds approach, now using complete bands.
      // Integer comparisons avoid rounding at LOW/MEDIUM/HIGH boundaries.
      const span = band.maxMark - band.minMark + 1;
      const offsetTimesThree = (total - band.minMark) * 3;
      const levelIndex = offsetTimesThree < span ? 0 : offsetTimesThree < 2 * span ? 1 : 2;
      const levelRanges = LEVELS.map((level, index) => ({
        level,
        minMark: band.minMark + Math.ceil(index * span / 3),
        maxMark: band.minMark + Math.ceil((index + 1) * span / 3) - 1
      }));

      return {
        grade: band.grade,
        level: LEVELS[levelIndex],
        minMark: band.minMark,
        maxMark: band.maxMark,
        pct: total * 100 / maximum,
        levelRanges
      };
    }

    function readMarks(input, maximum, paperName) {
      // A number input can have bad input even when its .value appears empty.
      if (input.validity.badInput) {
        return { error: `${paperName}: enter a whole number from 0 to ${maximum}.` };
      }
      if (input.value.trim() === "") {
        return { empty: true };
      }
      const value = Number(input.value);
      if (!Number.isFinite(value) || !Number.isInteger(value) || value < 0 || value > maximum) {
        return { error: `${paperName}: enter a whole number from 0 to ${maximum}.` };
      }
      return { value };
    }

    function updateGrade() {
      calculationVersion += 1;

      // Clear the previous result first, so invalid or incomplete input can
      // never leave an old total or an old grade on screen or ready to copy.
      breakdownBox.value = "";
      summaryBox.textContent = "";
      copySummary.disabled = true;
      copyBreakdown.disabled = true;
      copiedMessageSummary.textContent = "";
      copiedMessageBreakdown.textContent = "";
      validationMessage.textContent = "";
      validationMessage.hidden = true;

      papers.forEach(paper => paper.input.setAttribute("aria-invalid", "false"));
      // Read and validate ONLY the selected papers. An unmarked paper is not zero.
      const markedPapers = getSelectedPapers().map(paper => {
        const marks = readMarks(paper.input, paper.maximum, `${paper.name} marks`);
        paper.input.setAttribute("aria-invalid", marks.error ? "true" : "false");
        return { ...paper, ...marks };
      });

      const errors = markedPapers.map(paper => paper.error).filter(Boolean);
      if (errors.length > 0) {
        validationMessage.textContent = errors.join("\n");
        validationMessage.hidden = false;
        return;
      }
      if (markedPapers.some(paper => paper.empty)) {
        if (!markedPapers.every(paper => paper.empty)) {
          validationMessage.textContent = "Enter both paper marks to calculate the combined grade.";
          validationMessage.hidden = false;
        }
        return;
      }

      // Sum raw marks and their matching maxima; do not average paper percentages.
      const total = markedPapers.reduce((sum, paper) => sum + paper.value, 0);
      const maximum = markedPapers.reduce((sum, paper) => sum + paper.maximum, 0);
      const result = determineGrade(total, maximum);
      const paperContext = markedPapers.length === 1
        ? `Paper marked: ${markedPapers[0].name}`
        : "Papers marked: Non-calculator and calculator";
      const paperMarks = markedPapers
        .map(paper => `${paper.name}: ${paper.value} / ${paper.maximum}`)
        .join("\n");
      const maximumNote = markedPapers.length === 1
        ? `Maximum total: ${maximum} marks (${markedPapers[0].name.toLowerCase()} only).`
        : `Maximum total: ${markedPapers.map(paper => paper.maximum).join(" + ")} = ${maximum} marks.`;
      const rangeLabel = markedPapers.length === 1 ? "selected paper marks" : "combined marks";
      // Round only the displayed percentage, never the value used for grading.
      const percentage = result.pct.toFixed(2);
      const levelBreakdown = result.levelRanges
        .map(range => `${range.level}: ${range.minMark} – ${range.maxMark}`)
        .join("\n");

      breakdownBox.value =
`GCSE MATHS GRADE CALCULATION

${paperContext}
${paperMarks}
Total: ${total} / ${maximum}
Percentage: ${percentage}%

Assigned Grade: ${result.grade} (${result.level})

Grade Band Range (out of ${maximum}):
${result.minMark} – ${result.maxMark}

LOW / MEDIUM / HIGH ranges (${rangeLabel}):
${levelBreakdown}

Notes:
- ${maximumNote}
- Only the selected paper(s) contribute to the total and maximum.
- The supplied minimum percentage boundaries are used without gaps.
- Each grade ends one mark before the next grade starts.
- Grading uses unrounded thresholds, not the displayed percentage.
- LOW / MEDIUM / HIGH divide each whole-mark band into thirds as evenly as possible.
- Percentages are displayed to 2 decimal places.`;

      summaryBox.textContent =
`Assigned Grade: ${result.grade} (${result.level})
Total Marks: ${total} / ${maximum}
Percentage: ${percentage}%
${paperContext}`;

      copySummary.disabled = false;
      copyBreakdown.disabled = false;
    }

    paperCountSelect.addEventListener("change", syncPaperSelection);
    paperChoiceSelect.addEventListener("change", syncPaperSelection);
    noncalcInput.addEventListener("input", updateGrade);
    calcInput.addEventListener("input", updateGrade);
    // Also refresh when the browser restores form values from its page cache.
    window.addEventListener("pageshow", syncPaperSelection);

    async function writeClipboard(text) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          // Try the legacy fallback when Clipboard API permission is unavailable.
        }
      }

      const previousFocus = document.activeElement;
      const temporary = document.createElement("textarea");
      temporary.value = text;
      temporary.readOnly = true;
      temporary.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;font-size:16px;";
      document.body.appendChild(temporary);
      try {
        temporary.focus();
        temporary.select();
        temporary.setSelectionRange(0, temporary.value.length);
        return document.execCommand("copy") === true;
      } catch (_) {
        return false;
      } finally {
        temporary.remove();
        if (previousFocus && previousFocus.isConnected && typeof previousFocus.focus === "function") {
          previousFocus.focus({ preventScroll: true });
        }
      }
    }

    async function copyOutput(text, messageElement) {
      if (text.trim() === "") {
        messageElement.textContent = "Nothing to copy.";
        return;
      }
      const version = calculationVersion;
      const success = await writeClipboard(text);
      // Do not show an outdated confirmation after the marks have changed.
      if (version !== calculationVersion) return;
      messageElement.textContent = success
        ? "Copied!"
        : "Copy failed. Please select the text and copy it manually.";
    }

    copyBreakdown.addEventListener("click", () => {
      copyOutput(breakdownBox.value, copiedMessageBreakdown);
    });

    copySummary.addEventListener("click", () => {
      copyOutput(summaryBox.textContent, copiedMessageSummary);
    });

    // Retain the original right-click and view-source shortcut restrictions.
    // These are interface restrictions, not protection for client-side source code.
    document.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (
        key === "f12" ||
        (event.ctrlKey && key === "u") ||
        (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key))
      ) {
        event.preventDefault();
      }
    });

    syncPaperSelection();
  </script>
</body>
</html>
